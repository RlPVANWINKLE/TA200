<app-screen
[backroute]="'/allusers'"
[title]="'Edit User'"
    >
  <div class="text-center fs-5 White pb-2">Edit User</div>
  <div class="text-start fs-6 White BorderBottomWhite pb-1">ID. NO - {{User.Id}}</div>
  <div class="text-start fs-6 White BorderBottomWhite pb-1">Name: {{User.Name}}</div>
  <div class="row BorderBottomWhite py-1">
    <div class="col-2 text-start fs-6 White">FP</div>
    <div class="col-6 fs-6 text-start"><button (click)="Enroll()">Enroll FP</button></div>
    <div class="col-2 text-start fs-6 White">{{User.FingerPrint}}</div>
  </div>
  <div class="row BorderBottomWhite py-1">
    <div class="col-2 text-start fs-6 White">PWD</div>
    <div class="col-6 fs-6 text-start"><button>Enroll PWD</button></div>
  </div>
  <div class="row BorderBottomWhite py-1">
    <div class="col-2 text-start fs-6 White">CARD</div>
    <div class="col-6 fs-6 text-start"><button>Enroll CARD</button></div>
  </div>
</app-screen>
