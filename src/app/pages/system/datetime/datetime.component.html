<app-screen [backroute]="'/system'">
    <div class="fs-5" style="color: white;">Date Time</div>
    <app-list-item-no-icon
    [Title]="'Set Date'"
    [Value]="'1/1/2024'"
    ></app-list-item-no-icon>
    <app-list-item-no-icon
    [Title]="'Set Time'"
    [Value]="'12:00:00 AM'"
    ></app-list-item-no-icon>
    <app-list-item-no-icon
    [Title]="'24-Hour Time'"
    [Value]="'NO'"
    ></app-list-item-no-icon>
    <app-list-item-no-icon
    [Title]="'Date Format'"
    [Value]="'MM/DD/YY'"
    ></app-list-item-no-icon>
    <app-list-item-no-icon
    [Title]="'Daylight Svg Time'"
    [Value]="'NO'"
    ></app-list-item-no-icon>
    <app-list-item-no-icon
    [Title]="'Dayligh Svg Mode'"
    [Value]="'By week/day'"
    ></app-list-item-no-icon>
</app-screen>
