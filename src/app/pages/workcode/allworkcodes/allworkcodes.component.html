<app-screen [backroute]="'/work-code'">
    <div class="mt-3">
        <div *ngFor="let item of Jobs" id="{{item.Code}}" class="White jobCode" (click)="JobCode(item.Code)">
            <p style="display: inline; width: 25%; float: left;">{{item.Code}}</p>
            <p style=" display: inline; width: 75%; float: right;">{{item.Description}}</p>
        </div>
    </div>
</app-screen>
